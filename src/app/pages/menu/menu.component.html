<div class="relative min-h-screen overflow-hidden px-6 py-12">
  <div class="mx-auto flex w-full max-w-5xl flex-col items-center gap-10">
    <div class="text-center">
      <p class="text-sm uppercase tracking-[0.4em] text-gold-200/80">Tabletop</p>
      <h1 class="mt-4 text-5xl font-semibold tracking-wide text-ink-50 sm:text-6xl">
        Luegen
      </h1>
      <h2 class="mt-2 text-base font-medium tracking-[0.35em] text-emerald-200/80 sm:text-lg">
        The Game
      </h2>
    </div>

    <div class="relative w-full max-w-xl rounded-3xl border border-emerald-500/30 bg-felt-900/70 p-8 shadow-[0_30px_80px_-40px_rgba(0,0,0,0.85)] backdrop-blur">
      <div class="absolute -right-12 -top-12 h-28 w-28 rounded-full bg-emerald-500/20 blur-2xl"></div>
      <div class="absolute -left-10 bottom-0 h-24 w-24 rounded-full bg-gold-400/20 blur-2xl"></div>

      <!-- @for (card of cards; track $index) {
      <div
        class="stack-card"
        [style.transform]="'rotate(' + card.degree + 'deg)'"
        [style.top]="$index * 2 + 'px'"
        [style.left]="$index * 2 + 'px'"
      >
        <app-card class="card" [suit]="card.suit" [rank]="card.rank"></app-card>
      </div>
      } -->

      @if (hasSession) {
        <div class="rounded-2xl border border-emerald-400/30 bg-felt-950/60 px-4 py-4 text-center">
          <p class="text-xs uppercase tracking-[0.35em] text-emerald-200/80">
            Player Name
          </p>
          <p class="mt-2 text-xl font-semibold text-ink-50">
            {{ currentDisplayName }}
          </p>
        </div>
      } @else {
        <label class="text-xs uppercase tracking-[0.35em] text-emerald-200/80">
          Player Name
        </label>
        <input
          type="text"
          [(ngModel)]="displayName"
          placeholder="Enter your name"
          class="mt-3 w-full rounded-2xl border border-emerald-400/40 bg-felt-950/70 px-4 py-3 text-lg text-ink-50 placeholder:text-ink-300/70 focus:border-gold-300/70 focus:outline-none focus:ring-2 focus:ring-gold-400/40"
        />
      }

      <div class="mt-16 grid gap-6 sm:grid-cols-2">
        <button
          (click)="btnJoinGameClick()"
          class="group relative overflow-hidden rounded-2xl bg-gradient-to-br from-emerald-400 via-emerald-500 to-emerald-600 px-6 py-3 text-lg font-semibold text-ink-950 shadow-[0_18px_30px_-20px_rgba(34,197,94,0.85)] transition hover:translate-y-[-1px] hover:from-emerald-300 hover:via-emerald-400 hover:to-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200/60 focus:ring-offset-2 focus:ring-offset-felt-950"
        >
          <span class="relative z-10">Join Game</span>
          <span class="absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(255,255,255,0.5),transparent_70%)] opacity-0 transition group-hover:opacity-100"></span>
        </button>
        <button
          (click)="btnCreateGameClick()"
          class="relative overflow-hidden rounded-2xl border border-gold-300/60 bg-felt-950/70 px-6 py-3 text-lg font-semibold text-gold-100 shadow-[0_14px_24px_-18px_rgba(250,204,21,0.6)] transition hover:-translate-y-[1px] hover:border-gold-200 hover:bg-felt-900 focus:outline-none focus:ring-2 focus:ring-gold-200/60 focus:ring-offset-2 focus:ring-offset-felt-950"
        >
          Create Game
        </button>
        @if (hasSession) {
          <button
            (click)="btnLogoutClick()"
            class="sm:col-span-2 rounded-2xl border border-ink-300/40 bg-felt-950/50 px-6 py-3 text-sm font-semibold uppercase tracking-[0.35em] text-ink-200 transition hover:border-ink-200/70 hover:text-ink-50"
          >
            Logout
          </button>
        }
      </div>
    </div>

    <p class="text-center text-xs uppercase tracking-[0.35em] text-ink-300/70">
      Bluff. Bid. Believe.
    </p>
  </div>
</div>
