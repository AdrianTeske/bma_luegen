<div class="relative min-h-screen overflow-hidden px-6 py-12">
  <div class="mx-auto flex w-full max-w-4xl flex-col items-center gap-10">
    <div class="text-center">
      <p class="text-xs uppercase tracking-[0.5em] text-gold-200/70">Setup</p>
      <h1 class="mt-4 text-4xl font-semibold tracking-wide text-ink-50 sm:text-5xl">
        Create Lobby
      </h1>
      <p class="mt-3 max-w-xl text-sm text-ink-200/80">
        Set the number of decks for the table and open a fresh lobby.
      </p>
    </div>

    <div class="relative w-full max-w-xl rounded-3xl border border-emerald-500/30 bg-felt-900/70 p-8 shadow-[0_30px_80px_-40px_rgba(0,0,0,0.85)] backdrop-blur">
      <div class="absolute -right-12 -top-12 h-28 w-28 rounded-full bg-emerald-500/20 blur-2xl"></div>
      <div class="absolute -left-10 bottom-0 h-24 w-24 rounded-full bg-gold-400/20 blur-2xl"></div>

      <label class="text-xs uppercase tracking-[0.35em] text-emerald-200/80">
        Decks
      </label>
      <div class="mt-3 flex items-center gap-3">
        <input
          type="number"
          min="1"
          max="8"
          step="1"
          [(ngModel)]="decks"
          class="w-full rounded-2xl border border-emerald-400/40 bg-felt-950/70 px-4 py-3 text-lg text-ink-50 focus:border-gold-300/70 focus:outline-none focus:ring-2 focus:ring-gold-400/40"
        />
        <span class="rounded-full border border-emerald-400/30 bg-felt-950/60 px-3 py-2 text-xs uppercase tracking-[0.35em] text-emerald-200/70">
          {{ totalCards }} Cards
        </span>
      </div>

      <div class="mt-10 grid gap-4 sm:grid-cols-2">
        <button
          (click)="createLobbyClick()"
          class="group relative overflow-hidden rounded-2xl bg-gradient-to-br from-emerald-400 via-emerald-500 to-emerald-600 px-6 py-3 text-lg font-semibold text-ink-950 shadow-[0_18px_30px_-20px_rgba(34,197,94,0.85)] transition hover:translate-y-[-1px] hover:from-emerald-300 hover:via-emerald-400 hover:to-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200/60 focus:ring-offset-2 focus:ring-offset-felt-950"
        >
          <span class="relative z-10">Create Lobby</span>
          <span class="absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(255,255,255,0.5),transparent_70%)] opacity-0 transition group-hover:opacity-100"></span>
        </button>
        <button
          routerLink="/"
          class="rounded-2xl border border-gold-300/60 bg-felt-950/70 px-6 py-3 text-lg font-semibold text-gold-100 shadow-[0_14px_24px_-18px_rgba(250,204,21,0.6)] transition hover:-translate-y-[1px] hover:border-gold-200 hover:bg-felt-900 focus:outline-none focus:ring-2 focus:ring-gold-200/60 focus:ring-offset-2 focus:ring-offset-felt-950"
        >
          Back to Menu
        </button>
      </div>
    </div>

    <p class="text-center text-xs uppercase tracking-[0.35em] text-ink-300/70">
      Keep it tight for bluff-heavy rounds.
    </p>
  </div>
</div>
