<div class="hand-container">
    @for (card of cards(); track $index) {
        <app-card [suit]="card.suit" [rank]="card.rank"></app-card>
    }
</div>

<style>
.hand-container {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 1000;
    max-width: 90vw;
    overflow-x: auto;
    padding-bottom: 10px;
}

.hand-container app-card {
    flex: 0 0 auto;
    transition: margin-left 0.2s;
}

@media (max-width: 900px) {
    .hand-container {
        gap: 0;
    }
    .hand-container app-card:not(:first-child) {
        margin-left: -40px; /* Adjust for more/less overlap */
    }
}
</style>
